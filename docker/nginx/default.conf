server {
    server_tokens off;
    listen 80;
    server_name _;

    root /var/www/app/public;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;


    client_max_body_size 3m;
    # Front end: static files (index.html, js, css)
    location / {
        try_files $uri $uri/ =404;
    }

    # API: EVERY /api/... request goes to the one front controller
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME     /api/index.php;
        fastcgi_pass  php:9000;
    }

    # No other .php file is ever executed
    location ~ \.php$ {
        return 404;
    }

    # Never serve hidden files (.env, .git, ...)
    location ~ /\. {
        deny all;
    }
}
